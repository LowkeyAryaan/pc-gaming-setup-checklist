name: Publish verified v1.4.1 APK to Releases

# One-time operation: publication is limited to the existing, verified draft.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.4.1-release.yml'

permissions:
  contents: write

jobs:
  publish-verified-release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release and signed APK identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_ID=415802305
          SIGNED_RUN=39030402939
          APP_SHA=ae6b6131c2dcf35cb9a68a160549866847e5aeee
          APK_SHA=sha256:3553607165830c55f8fcd056e5a2c0ca602c1ab748a9d14c8c3fee812ba60a3f
          RELEASE_JSON=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          test "$(jq -r '.draft' <<< "$RELEASE_JSON")" = "true"
          test "$(jq -r '.tag_name' <<< "$RELEASE_JSON")" = "v1.4.1"
          test "$(jq -r '.target_commitish' <<< "$RELEASE_JSON")" = "$APP_SHA"
          test "$(jq -r '.assets | length' <<< "$RELEASE_JSON")" = "1"
          test "$(jq -r '.assets[0].name' <<< "$RELEASE_JSON")" = "PC-Gaming-Setup-Checklist-v1.4.1-signed.apk"
          test "$(jq -r '.assets[0].content_type' <<< "$RELEASE_JSON")" = "application/vnd.android.package-archive"
          test "$(jq -r '.assets[0].digest' <<< "$RELEASE_JSON")" = "$APK_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNED_RUN" --jq '.conclusion')" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SIGNED_RUN" --jq '.head_sha')" = "$APP_SHA"

      - name: Publish draft and add final release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'NOTES'
          ## PC Gaming Setup Checklist v1.4.1

          Your PC and gaming setup, all in one free, offline-first Android app.

          ### Download and install

          **Download PC-Gaming-Setup-Checklist-v1.4.1-signed.apk under Assets.**
          This is the direct Android installer. No extraction or ZIP file is needed.
          On Android, open the APK and follow your device's installation prompts.

          **Requirements:** Android 6.0 or newer.

          ### Features

          - Multiple setup presets, custom products, categories, pictures, notes and shopping links
          - PC contribution and shortfall calculations with live savings tracking
          - Currency display options per preset (changing currency does not convert amounts)
          - Export/import JSON backups to preserve your local setup data
          - Instant welcome screen and smooth entry animation
          - Local feedback history and email feedback addressed to the creator

          ### Data and updates

          Your checklist and savings are kept on your device; there is no account or cloud sync.
          **Export backups before clearing storage, switching phones or uninstalling.**
          This release uses the stable Android package ID com.aryaan.pcsetup.community.
          Earlier debug/preview APKs have different package IDs and install independently.
          Back up and import presets if moving from those builds.

          Made by Aryaan. Instagram: https://www.instagram.com/aryaan_creates/

          MIT-licensed application source. Images and artwork have their own usage terms.
          NOTES
          jq -n --rawfile body /tmp/release-notes.md \
            '{draft:false,prerelease:false,body:$body}' >/tmp/release-update.json
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/415802305" \
            --input /tmp/release-update.json > /tmp/release-result.json
          test "$(jq -r '.draft' /tmp/release-result.json)" = "false"
          echo "Release published."

      - name: Verify published release contains direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/415802305" > /tmp/release.json
          test "$(jq -r '.draft' /tmp/release.json)" = "false"
          test "$(jq -r '.tag_name' /tmp/release.json)" = "v1.4.1"
          test "$(jq -r '.assets[0].name' /tmp/release.json)" = "PC-Gaming-Setup-Checklist-v1.4.1-signed.apk"
          echo "Published URL: $(jq -r '.html_url' /tmp/release.json)"
          echo "Direct signed APK: $(jq -r '.assets[0].browser_download_url' /tmp/release.json)"
