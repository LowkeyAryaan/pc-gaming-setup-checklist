name: Build signed community release APK

# Manual-only: never expose signing secrets to pull-request builds.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK 35 tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate app source
        run: |
          node --check app/src/main/assets/budget-model.js
          node --check app/src/main/assets/planner.js
          node --check app/src/main/assets/premium-v15.js
          node --check app/src/main/assets/design-v16.js
          node --check app/src/main/assets/glass-v17.js
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/shell.js
          node --check app/src/main/assets/feedback-store.js
          node --check app/src/main/assets/onboarding.js
          node --test app/tests/*.test.cjs

      - name: Restore private release keystore
        shell: bash
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" || -z "$ANDROID_SIGNING_STORE_PASSWORD" || -z "$ANDROID_SIGNING_KEY_ALIAS" || -z "$ANDROID_SIGNING_KEY_PASSWORD" ]]; then
            echo "Required Android signing secrets are missing. See docs/RELEASE_SIGNING.md" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/community-release.jks"
          test -s "$RUNNER_TEMP/community-release.jks"
          echo "Keystore recovered in ephemeral runner storage."

      - name: Build stable signed release APK
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}/community-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify identity and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.aryaan.pcsetup.community'"
          cp "$APK" "PC-Gaming-Setup-Checklist-v1.7.1-signed.apk"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: PC-Gaming-Setup-Checklist-v1.7.1-SIGNED
          path: PC-Gaming-Setup-Checklist-v1.7.1-signed.apk
          if-no-files-found: error
          retention-days: 60

      - name: Clear temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/community-release.jks"
